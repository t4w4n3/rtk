# cargo-deny configuration for RTK supply chain security
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = false
no-default-features = false

# ── Advisories ────────────────────────────────────────────────────────────────

[advisories]
ignore = []

# ── Licenses ──────────────────────────────────────────────────────────────────

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.8

# ── Bans ──────────────────────────────────────────────────────────────────────

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
    { crate = "tokio", reason = "RTK is single-threaded by design; async adds 5-10ms startup overhead" },
    { crate = "async-std", reason = "RTK is single-threaded by design; async adds 5-10ms startup overhead" },
    { crate = "futures", reason = "RTK is single-threaded by design; no async runtime needed" },
    { crate = "actix-web", reason = "RTK is a CLI tool, not a web server" },
]

# ── Sources ───────────────────────────────────────────────────────────────────

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
